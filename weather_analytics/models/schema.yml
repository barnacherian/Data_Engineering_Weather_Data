version: 2

models:
  - name: stg_weather
    description: "Cleaned weather staging model built from Parquet in SeaweedFS"
    columns:
      - name: date
        description: "The timestamp of the weather record"
        tests:
          - not_null
      - name: temperature_2m
        description: "Air temperature at 2 meters"
        tests:
          - not_null
      - name: wind_speed_10m
        description: "Wind speed at 10 meters"
        tests:
          - not_null