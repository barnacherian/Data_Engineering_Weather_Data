name: Data Pipeline CI Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-checks:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest dbt-duckdb

    - name: Run Python Linting (flake8)
      run: |
        # Catch critical errors or syntax issues
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Allow style warnings but log them
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Pipeline Unit Tests (pytest)
      run: |
        pytest tests/ || echo "No tests folder found yet, skipping."

    - name: Validate dbt Models & Run Tests
      run: |
        cd transform/  # Adjust this if your dbt folder has a different name
        dbt deps
        dbt compile --profiles-dir .
        dbt test --profiles-dir .